name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed / Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Ensure Persistent Signing Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding persistent keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Auto-Increment Semantic Versioning
        id: versioning
        run: |
          # Read base version from app/build.gradle.kts
          BASE_VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.4.1"
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # If triggered by a manual git tag push, use that explicit tag
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            TAG="$RAW_TAG"
            CLEAN_VERSION="${TAG#v}"
            # Compute a monotonically increasing code
            V_CODE=$(( ${{ github.run_number }} + 100 ))
          else
            # For branch push (main/master), auto-increment patch number based on github.run_number
            # e.g., Base 1.4 -> 1.4.<run_number>
            MAJOR_MINOR=$(echo "$BASE_VERSION" | awk -F. '{print $1"."$2}')
            CLEAN_VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
            TAG="v${CLEAN_VERSION}"
            V_CODE=${{ github.run_number }}
          fi

          echo "Computed Version Name: $CLEAN_VERSION"
          echo "Computed Version Tag:  $TAG"
          echo "Computed Version Code: $V_CODE"

          # Inject into app/build.gradle.kts so the compiled APK contains the exact new version
          sed -i "s/versionCode = [0-9]*/versionCode = $V_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$CLEAN_VERSION\"/" app/build.gradle.kts

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug & Release APK
        run: |
          if ./gradlew --version >/dev/null 2>&1; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            echo "gradle-wrapper.jar invalid or missing, using installed Gradle 8.11.1 runner..."
            gradle assembleRelease || gradle assembleDebug
          fi

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "HCM-SMS Build (${{ steps.versioning.outputs.tag }})"
          body: |
            Automated Semantic Release Build for HCM School Management System.
            Version: ${{ steps.versioning.outputs.tag }}
            Build Code: ${{ steps.versioning.outputs.version_code }}
            Commit: ${{ github.sha }}

            Download and install the attached APK on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
