name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed / Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Ensure Persistent Signing Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding persistent keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug & Release APK
        run: |
          if ./gradlew --version >/dev/null 2>&1; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            echo "gradle-wrapper.jar invalid or missing, using installed Gradle 8.11.1 runner..."
            gradle assembleRelease || gradle assembleDebug
          fi

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            GRADLE_VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
            if [ -n "$GRADLE_VERSION" ]; then
              TAG="v${GRADLE_VERSION}"
            else
              TAG="v1.4.0"
            fi
          fi
          echo "Detected Release Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "HCM-SMS Build (${{ steps.release_tag.outputs.tag }})"
          body: |
            Automated Release Build for HCM School Management System.
            Version: ${{ steps.release_tag.outputs.tag }}
            Download and install the attached APK on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
